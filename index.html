<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Restaurant Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { display: flex; justify-content: center; align-items: center;
         min-height: 100vh; background: #f5f5f5; }
  .chat { width: 380px; height: 600px; background: white;
          border-radius: 16px; display: flex; flex-direction: column;
          box-shadow: 0 4px 24px rgba(0,0,0,0.1); overflow: hidden; }
  .header { background: #1a1a2e; color: white; padding: 16px 20px; }
  .header h3 { font-size: 15px; font-weight: 500; }
  .header p { font-size: 12px; opacity: 0.7; margin-top: 2px; }
  .messages { flex: 1; overflow-y: auto; padding: 16px;
              display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px;
         font-size: 13px; line-height: 1.5; }
  .msg.bot { background: #f0f0f0; align-self: flex-start;
             border-bottom-left-radius: 4px; }
  .msg.user { background: #1a1a2e; color: white; align-self: flex-end;
              border-bottom-right-radius: 4px; }
  .msg.typing { color: #999; font-style: italic; }
  .input-row { display: flex; padding: 12px; border-top: 1px solid #eee; gap: 8px; }
  input { flex: 1; border: 1px solid #ddd; border-radius: 8px;
          padding: 10px 14px; font-size: 13px; outline: none; }
  input:focus { border-color: #1a1a2e; }
  button { background: #1a1a2e; color: white; border: none;
           border-radius: 8px; padding: 10px 16px;
           font-size: 13px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="chat">
  <div class="header">
    <h3>Restaurant Assistant</h3>
    <p>Online — replies in seconds</p>
  </div>
  <div class="messages" id="messages">
    <div class="msg bot">Hi! Welcome. What would you like to order today?</div>
  </div>
  <div class="input-row">
    <input id="inp" placeholder="Type your order..."
           onkeydown="if(event.key==='Enter')send()" />
    <button id="btn" onclick="send()">Send</button>
  </div>
</div>
<script>
const WEBHOOK = 'https://naaaaaa2345322.app.n8n.cloud/webhook/chat';
const sessionId = 'session_' + Math.random().toString(36).slice(2);
let history = [];
let pendingItem = null;
let busy = false;

function addMsg(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
  return div;
}

async function send() {
  if (busy) return;
  const inp = document.getElementById('inp');
  const btn = document.getElementById('btn');
  const text = inp.value.trim();
  if (!text) return;

  inp.value = '';
  busy = true;
  btn.disabled = true;

  addMsg(text, 'user');
  history.push({ role: 'user', content: text });
  const typing = addMsg('typing...', 'bot typing');

  try {
    const res = await fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: sessionId,
        message: text,
        history: history,
        pending_item: pendingItem
      })
    });

    const raw = await res.text();
    let data;
    try {
      data = JSON.parse(raw);
    } catch(e) {
      data = { reply: raw };
    }

    const reply = data.reply || 'Sorry, something went wrong.';

    if (data.pending_item && data.pending_item !== '') {
      pendingItem = data.pending_item;
    }
    if (data.order_confirmed === true) {
      pendingItem = null;
    }

    typing.remove();
    addMsg(reply, 'bot');
    history.push({ role: 'assistant', content: reply });

  } catch(e) {
    typing.remove();
    addMsg('Connection error. Please try again.', 'bot');
  }

  busy = false;
  btn.disabled = false;
  document.getElementById('inp').focus();
}
</script>
</body>
</html>
